<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>StreamTR – Oyun Yayın Platformu</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body{
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:#0b0f1c;
      color:#fff;
      margin:0;
      padding:24px;
    }
    .container{
      max-width:720px;
      margin:auto;
      background:#161b2c;
      padding:24px;
      border-radius:16px;
      box-shadow:0 8px 24px rgba(0,0,0,0.4);
    }
    h1{ margin-top:0; }
    .form-group{ margin-bottom:12px; }
    label{ display:block; margin-bottom:6px; font-size:14px; }
    input[type="email"], input[type="password"]{
      width:100%;
      padding:10px;
      border-radius:8px;
      border:none;
      background:#1f2538;
      color:#fff;
    }
    button{
      background:#4f6df5;
      color:#fff;
      border:none;
      padding:10px 16px;
      border-radius:8px;
      cursor:pointer;
      font-weight:600;
    }
    .msg{ font-size:13px; margin-top:8px; }
    .error{ color:#ff6b6b; }
    .success{ color:#4efd4f; }
    #auth-area{ display:none; }
  </style>
</head>
<body>

  <div class="container">
    <h1>StreamTR – Kayıt / Giriş</h1>

    <!-- KAYIT FORMU -->
    <div id="register-form">
      <div class="form-group">
        <label>Ad Soyad</label>
        <input id="fullName" type="text" placeholder="Örn: Ayşegül Kaya" />
      </div>
      <div class="form-group">
        <label>E-posta</label>
        <input id="email" type="email" placeholder="<EMAIL_ADDRESS>" />
      </div>
      <div class="form-group">
        <label>Şifre</label>
        <input id="pass" type="password" placeholder="En az 6 karakter" />
      </div>
      <button id="register-btn">Kayıt Ol</button>
      <div id="reg-msg" class="msg"></div>
    </div>

    <!-- GİRİŞ FORMU -->
    <div id="login-form" style="display:none;">
      <div class="form-group">
        <label>E-posta</label>
        <input id="login-email" type="email" />
      </div>
      <div class="form-group">
        <label>Şifre</label>
        <input id="login-pass" type="password" />
      </div>
      <button id="login-btn">Giriş Yap</button>
      <div id="login-msg" class="msg"></div>
    </div>

    <!-- BAŞARILI GİRİŞ SONRASI ALAN -->
    <div id="auth-area">
      <p>Hoş geldin! Artık yayın yapabilirsin.</p>
      <button id="go-home">Ana Sayfaya</button>
    </div>

    <!-- KİMLİK BUTONU (ilk girişte kayıt yerine giriş göster) -->
    <p style="margin-top:16px; font-size:13px;">
      Zaten hesabın var mı? <button id="switch-to-login" style="background:none;border:1px solid #4f6df5;color:#4f6df5;">Giriş yap</button>
    </p>
  </div>

  <!-- Firebase JS (modül şeklinde) -->

      projectId: "streamtr-ba45a",
      storageBucket: "streamtr-ba45a.firebasestorage.app",

    const $regMsg = document.getElementById('reg-msg');

    // Kullanıcı durumunu dinle
    onAuthStateChanged(auth, (user) => {
      if (user) {
        $regForm.style.display = 'none';
        $loginForm.style.display = 'none';
        $authArea.style.display = 'block';
      } else {
        $regForm.style.display = 'block';
        $loginForm.style.display = 'none';
        $authArea.style.display = 'none';
      }
    });

    // Kayıt
    $regBtn.addEventListener('click', async () => {
      const name = document.getElementById('fullName').value;
      const email = document.getElementById('email').value;
      const pass = document.getElementById('pass').value;
      $regMsg.textContent = '';
      try {
        await createUserWithEmailAndPassword(auth, email, pass);
        // Kullanıcı adını ayrı tutmak için (opsiyonel) burada localStorage’a kaydedebilirsin
        localStorage.setItem('userName', name);
        $regMsg.className = 'msg success';
        $regMsg.textContent = 'Kayıt başarılı, otomatik giriş yapılıyor…';
      } catch (err) {
        $regMsg.className = 'msg error';
        $regMsg.textContent = err.message;
      }
    });
